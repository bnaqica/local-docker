#localstack stuff
version: '3.6'
services:
  localstack:
    container_name: "bnaqica-localstack"
    image: localstack/localstack
    ports:
      - "4565-4576:4565-4576"
      - 8001:8001
    environment:
      - SERVICES=sns,sqs,s3
      - DEBUG=${DEBUG- }
      - DATA_DIR=${DATA_DIR- }
      - PORT_WEB_UI=8001
      - LAMBDA_EXECUTOR=${LAMBDA_EXECUTOR- }
      - KINESIS_ERROR_PROBABILITY=${KINESIS_ERROR_PROBABILITY- }
      - DOCKER_HOST=unix:///var/run/docker.sock
      - HOST_TMP_FOLDER=${TMPDIR}
      - DEFAULT_REGION=us-east-1
    volumes:
      - "${TMPDIR:-/tmp/localstack}:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      # SNS topics, SQS queues, subscriptions and S3 buckets are created by this script
      - "./create-resources.sh:/etc/localstack/init/ready.d/create-resources.sh:ro"
