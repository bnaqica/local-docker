# Local Kafka (4-broker cluster, KRaft mode - no ZooKeeper)
#
#   docker compose up -d       start everything
#   docker compose down        stop (data is wiped - clean slate each run)
#
# Connect from apps on your machine:  localhost:9092,localhost:9093,localhost:9094,localhost:9095
#                                     (any one is enough to bootstrap; listing all survives a broker being down)
# Connect from other containers:      kafka:29092  (alias of kafka-1; or kafka-1..kafka-4:29092)
# Kafka UI:                           http://localhost:8085
#
# kafka-1..kafka-3 are broker + controller (a 3-voter quorum, so it tolerates losing one controller).
# kafka-4 is broker-only, since a 4-voter quorum is no more fault tolerant than 3.

x-kafka-env: &kafka-env
  # Every node must share the same cluster id (any base64 UUID; generate with kafka-storage.sh random-uuid)
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # PLAINTEXT      -> other containers (kafka-N:29092)
  # PLAINTEXT_HOST -> apps on your machine (localhost:909x)
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  # Internal topics: 3 replicas, still writable with one broker down
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # Topics should be created explicitly by kafka-setup below
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # Keep four JVMs from eating all of Docker's memory
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

x-kafka-node: &kafka-node
  image: apache/kafka:4.3.2
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 20
    start_period: 10s

services:
  kafka-1:
    <<: *kafka-node
    container_name: bnaqica-kafka-1
    ports:
      - "9092:9092"
    networks:
      default:
        aliases:
          - kafka   # keeps kafka:29092 working for Keycloak and other containers
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092

  kafka-2:
    <<: *kafka-node
    container_name: bnaqica-kafka-2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9093,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9093

  kafka-3:
    <<: *kafka-node
    container_name: bnaqica-kafka-3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9094,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:9094

  kafka-4:
    <<: *kafka-node
    container_name: bnaqica-kafka-4
    ports:
      - "9095:9095"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-4:29092,PLAINTEXT_HOST://localhost:9095

  # One-shot container: creates topics once every broker is healthy, then exits.
  # The topic list lives in create-topics.sh.
  kafka-setup:
    container_name: bnaqica-kafka-setup
    image: apache/kafka:4.3.2
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
      kafka-4: { condition: service_healthy }
    volumes:
      - ./create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    restart: "no"

  kafka-ui:
    container_name: bnaqica-kafka-ui
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8085:8080"
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
      kafka-4: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092,kafka-4:29092
      DYNAMIC_CONFIG_ENABLED: "true"
