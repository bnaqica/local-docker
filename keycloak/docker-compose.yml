services:
  keycloak:
    container_name: bnaqica-keycloak
    image: quay.io/keycloak/keycloak:26.8.1
    # start-dev: HTTP, relaxed hostname checks, embedded dev database (wiped on `docker compose down`).
    # --import-realm loads every *.json in /opt/keycloak/data/import on startup (skipped if the realm exists).
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"   # 8080 is used by the kafka-demo-ui container; management port 9000 stays internal (sonarqube uses 9000)
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8080
      # Fixed issuer for every token, so a service reaching Keycloak as http://keycloak:8080 from
      # another container still gets iss=http://localhost:8180/realms/kafka-demo
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # The kafka event listener (event-listener/) publishes login and admin events here, on Kafka's network
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - mailpit
    networks:
      - default
      - kafka   # start local-docker/kafka first; Keycloak joins its network to reach kafka:29092
    volumes:
      - "./realms:/opt/keycloak/data/import:ro"
      # The kafka event listener; build it first with `./gradlew build` in event-listener/
      - "./event-listener/build/libs:/opt/keycloak/providers:ro"
      # The kafka-demo login theme; start-dev doesn't cache themes, so CSS edits show on reload
      - "./themes/kafka-demo:/opt/keycloak/themes/kafka-demo:ro"
    healthcheck:
      # The image has no curl; use bash's /dev/tcp against the management port
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Catches every email Keycloak sends (invites, password resets, verification). Inbox: http://localhost:8025
  mailpit:
    container_name: bnaqica-mailpit
    image: axllent/mailpit:v1.27.10
    ports:
      - "8025:8025"

networks:
  kafka:
    name: kafka_default   # created by `docker compose up` in local-docker/kafka
    external: true
